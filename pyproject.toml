[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-browser"
version = "2.0.0"
description = "A Chromium browser harness built for LLM agents: text outlines with stable refs, actions that report what changed."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright>=1.49"]

[project.optional-dependencies]
yaml = ["pyyaml"]
test = ["pytest", "pyyaml"]

[project.scripts]
cb = "cb:main"

[tool.setuptools]
py-modules = ["cb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
