# Legacy (cb 1.x) YAML batch format — still supported. Run with:  cb batch examples/login_flow.yaml
# Each item is a single-key map {command: args}; args may be a string, a list, or a map (inline JSON).
# The line-per-command format (see signup.txt) is simpler for new scripts.

- goto: https://example.com/login
- wait_idle: 8000

# Smart bulk fill — keys are matched against field labels / placeholders / names.
- fill_form:
    Email: alex@example.com
    Password: hunter2
    Remember me: true

- act: "click Sign in"
- wait_url: dashboard
- snap: []
